name: Live provider tests

on:
  schedule:
    - cron: '0 6 * * 1,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test live currency providers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CURRENCY_SERVICES_LIVE_TESTS: '1'
      FIXER_FREE_TOKEN: ${{ secrets.FIXER_FREE_TOKEN }}
      MAGENTO_USERNAME: ${{ secrets.MAGENTO_USERNAME }}
      MAGENTO_PASSWORD: ${{ secrets.MAGENTO_PASSWORD }}

    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: master

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: bcmath, curl, json, simplexml
          coverage: none

      - name: Verify required secrets
        run: |
          if [ -z "$MAGENTO_USERNAME" ] || [ -z "$MAGENTO_PASSWORD" ] || [ -z "$FIXER_FREE_TOKEN" ]; then
            echo "::error::MAGENTO_USERNAME, MAGENTO_PASSWORD, and FIXER_FREE_TOKEN secrets are required"
            exit 1
          fi

      - name: Install dependencies
        run: |
          composer config http-basic.repo.magento.com "$MAGENTO_USERNAME" "$MAGENTO_PASSWORD"
          composer require magento/framework:^103.0 --no-update
          composer install --prefer-dist --no-interaction --no-progress

      - name: Test live providers
        run: vendor/bin/phpunit -c Test/phpunit.xml --no-coverage
